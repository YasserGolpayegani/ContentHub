services:

  contenthub-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contenthub-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=contenthub-sqlserver;Database=ContentHubDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      - contenthub-sqlserver

  contenthub-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: contenthub-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - contenthub-sqlserver-data:/var/opt/mssql

volumes:
  contenthub-sqlserver-data: